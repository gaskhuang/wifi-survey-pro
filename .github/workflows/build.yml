name: Build — macOS DMG + Windows EXE

on:
  push:
    branches: [master, main]
    tags:     ["v*"]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Windows — PyInstaller → ZIP
  # ─────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows EXE
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install `
            flask Pillow numpy scipy reportlab `
            ping3 dnspython mac-vendor-lookup `
            pywebview pyinstaller

      - name: Build EXE
        run: |
          pyinstaller `
            --name "WiFi Survey Pro" `
            --onedir --windowed `
            --distpath dist_win `
            --workpath build_win `
            --noconfirm `
            --add-data "frontend;frontend" `
            --add-data "scanner_windows.py;." `
            --hidden-import flask `
            --hidden-import werkzeug `
            --hidden-import jinja2 `
            --hidden-import PIL `
            --hidden-import numpy `
            --hidden-import scipy `
            --hidden-import scipy.spatial `
            --hidden-import scipy.interpolate `
            --hidden-import reportlab `
            --hidden-import dns.resolver `
            --hidden-import ping3 `
            --hidden-import mac_vendor_lookup `
            --hidden-import webview `
            --hidden-import webview.platforms.winforms `
            --collect-all webview `
            --collect-all flask `
            --collect-all reportlab `
            --collect-all mac_vendor_lookup `
            main.py

      - name: Package as ZIP
        run: |
          Compress-Archive `
            -Path "dist_win\WiFi Survey Pro\*" `
            -DestinationPath "dist_win\WiFiSurveyPro-Windows.zip" `
            -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFiSurveyPro-Windows
          path: dist_win/WiFiSurveyPro-Windows.zip

  # ─────────────────────────────────────────────────────────────────────────
  # macOS — shell-script .app → DMG
  # ─────────────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS DMG
    runs-on: macos-14          # Apple Silicon runner

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create venv + install deps
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt

      - name: Build .app + DMG
        run: |
          chmod +x build_dmg.sh
          ./build_dmg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFiSurveyPro-macOS
          path: "dist/Wi-Fi Survey Pro.dmg"

  # ─────────────────────────────────────────────────────────────────────────
  # Release — attach both artifacts when a tag is pushed
  # ─────────────────────────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: WiFiSurveyPro-macOS
          path: artifacts/

      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: WiFiSurveyPro-Windows
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: |
            ## Wi-Fi Survey Pro ${{ github.ref_name }}

            ### 下載
            | 平台 | 檔案 |
            |------|------|
            | macOS | `Wi-Fi Survey Pro.dmg` — 拖到 Applications 安裝 |
            | Windows | `WiFiSurveyPro-Windows.zip` — 解壓後執行 `WiFi Survey Pro.exe` |

            ### macOS 首次開啟
            右鍵 > 開啟，或執行：
            ```
            xattr -d com.apple.quarantine "/Applications/Wi-Fi Survey Pro.app"
            ```
