name: Build — macOS DMG

# 每次推送都打包一次並上傳成 artifact，用來確認「乾淨環境也能打包成功」。
# 正式發佈改為人工：本機打包 → 驗證能在乾淨環境啟動 → gh release create。
# （Windows 版目前暫緩；日後恢復時可參考 git 歷史中的 build-windows job 與 build_windows.bat。）

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      # 測試只用標準庫（封包解析、辨識規則、NAT 判讀），用獨立的 Python 跑，不影響下面的打包
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  build-macos:
    name: macOS DMG (Apple Silicon)
    runs-on: macos-14            # Apple Silicon runner

    steps:
      - uses: actions/checkout@v4

      # build_dmg.sh 會自行下載並以 SHA256 驗證 python-build-standalone，
      # 不需要（也不應該）用 setup-python：那會讓 bundle 綁死在 runner 的路徑上。
      - name: Cache standalone Python
        uses: actions/cache@v4
        with:
          path: build/pbs-cache
          key: pbs-${{ hashFiles('build_dmg.sh') }}

      - name: Build .app + DMG
        run: |
          chmod +x build_dmg.sh
          ./build_dmg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetInspectPro-macOS
          path: "dist/NetInspect Pro.dmg"
